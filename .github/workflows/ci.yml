name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - run: gem install --no-document "puppet:~>8.10" puppet-lint metadata-json-lint
      - run: puppet parser validate manifests/ examples/
      - run: puppet-lint --relative --fail-on-warnings manifests/ examples/
      - run: metadata-json-lint --strict-license --strict-dependencies metadata.json
      - run: shellcheck -s sh files/es-python-fleet-install.sh scripts/build.sh
      - run: scripts/build.sh
